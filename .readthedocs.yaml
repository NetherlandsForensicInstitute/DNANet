# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - pip install --upgrade pip
    - pip install zensical
    - pip install -e .
    - cd docs && zensical build --clean -f ../zensical.toml

python:
  install:
    - method: pip
      path: .
