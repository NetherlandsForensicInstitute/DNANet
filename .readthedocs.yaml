# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - pip install --upgrade pip
    - pip install zensical
    - zensical build --clean -f docs/zensical.toml && mkdir -p $READTHEDOCS_OUTPUT/html && cp -r docs/site/* $READTHEDOCS_OUTPUT/html/
