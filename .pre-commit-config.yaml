default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: ^src/synthetic-profile-generation/|\.csv$|\.txt$|\.hid$|\.xml$
      - id: trailing-whitespace
        exclude: ^src/synthetic-profile-generation/|\.csv$|\.txt$|\.hid$|\.xml$
      - id: check-added-large-files
        args: ['--maxkb=10240']

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: pdm run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: true
        files: '\.py$'
      - id: ruff-format
        name: ruff format
        entry: pdm run ruff format
        language: system
        pass_filenames: true
        files: '\.py$'

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: 'pdm run pytest tests/ -x -q --no-cov'
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
