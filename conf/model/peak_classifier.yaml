# Conv1d peak classifier for allele/noise classification
name: peak_classifier

defaults:
  - /train@_global_.train: classification



architecture:
  _target_: dnanet.models.peak_classifier.PeakClassificationModel
  num_classes: ${data.num_classes}
  width: 120
  n_markers: 28
  embedding_dim: 8
  use_embedding: true
  include_max_pool_dyes: false
  hidden_channels: [32, 64]
  kernel_size: 7
  pooling: flat          # flat, avg, or attn
  activation: relu       # relu, tanh, or gelu
  use_batchnorm: false
  conv_dropout_p: 0.0
  head_dropout_p: 0.0
  downsample: maxpool    # maxpool or conv

loss:
  _target_: torch.nn.CrossEntropyLoss

data_transform:
  _target_: dnanet.data.transformer.PeakClassificationTransformer
  include_marker: ${model.architecture.use_embedding}
