# Training config for combined PeakNet
type: peaknet

defaults:
  - /metrics@_global_.metrics: multi-class

max_epochs: 100
batch_size: 16
learning_rate: 0.00012
weight_decay: 0.0005
num_workers: 7

optimizer:
  _target_: torch.optim.AdamW
  lr: ${train.learning_rate}
  weight_decay: ${train.weight_decay}

scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.8
  optimizer: ${train.optimizer}

early_stopping:
  monitor: val/f1
  patience: 25
  min_delta: 0.00
  mode: max

checkpoint:
  monitor: val/f1
  save_top_k: 1
  mode: max

lightning_module:
  _target_: dnanet.modules.peaknet.PeakNetModule
  learning_rate: ${train.learning_rate}
  weight_decay: ${train.weight_decay}
  loss_fn: ${model.loss}
  num_classes: ${data.num_classes}
  metrics:
    _target_: torchmetrics.MetricCollection
    metrics: ${metrics}
  batch_size: ${train.batch_size}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${train.batch_size}
  num_workers: ${train.num_workers}

