# Extension of the segmentation config with multi-class specific settings. Inherits from segmentation.yaml.
type: segmentation_mc

defaults:
  - segmentation
  - /metrics@_global_.metrics: multi-class


lightning_module:
  _target_: dnanet.modules.segmentation.MultiClassSegmentationModule  # TODO: New multi-class module
  learning_rate: ${train.learning_rate}
  weight_decay: ${train.weight_decay}
  threshold: ${train.threshold}
  loss_fn: ${model.loss}
  metrics:
    _target_: torchmetrics.MetricCollection
    metrics: ${metrics}
  batch_size: ${train.batch_size}

# Multi-class segmentation optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: ${train.learning_rate}
  weight_decay: ${train.weight_decay}