# Training hyperparameters for autoencoder reconstruction
type: reconstruction

max_epochs: 150
batch_size: 16
learning_rate: 0.001
weight_decay: 0.0
num_workers: 7
val_fraction: 0.2
test_fraction: 0.0
seed: 42

metrics:
  _target_: torchmetrics.MetricCollection
  metrics:
    mse:
      _target_: torchmetrics.regression.MeanSquaredError

optimizer:
  _target_: torch.optim.AdamW
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}

# No LR scheduler by default for reconstruction
scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 1.0  # effectively disabled
  optimizer: ${training.optimizer}

# No early stopping by default (long training benefits AE)
# early_stopping:
#   monitor: val/loss
#   patience: 10
#   min_delta: 0.001
#   mode: min

# Checkpointing
checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min

data_transform:
  _target_: dnanet.data.transformer.ReconstructionTransformer
  n_dyes: 6
  log_scale: true
  max_rfu: 33000

lightning_module:
  _target_: dnanet.modules.reconstruction.ReconstructionModule
  learning_rate: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  loss_fn: ${model.loss}
  scheduler: ${training.scheduler}
  metrics: ${training.metrics}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${training.batch_size}
  val_fraction: ${training.val_fraction}
  num_workers: ${training.num_workers}
  seed: ${training.seed}
  stratify_noc: ${oc.select:data.stratify_noc,false}
  group_by_replica: ${oc.select:data.group_by_replica,false}
