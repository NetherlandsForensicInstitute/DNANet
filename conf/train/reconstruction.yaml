# Training hyperparameters for autoencoder reconstruction
type: reconstruction

max_epochs: 150
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0
num_workers: 7
val_fraction: 0.1
test_fraction: 0.0
seed: 42

metrics:
  _target_: torchmetrics.MetricCollection
  metrics:
    mse:
      _target_: torchmetrics.regression.MeanSquaredError

optimizer:
  _target_: torch.optim.AdamW
  lr: ${train.learning_rate}
  weight_decay: ${train.weight_decay}

# No LR scheduler by default for reconstruction
#scheduler:
#  _target_: torch.optim.lr_scheduler.ExponentialLR
#  gamma: 1.0  # effectively disabled
#  optimizer: ${train.optimizer}

# No early stopping by default (long training benefits AE)
# early_stopping:
#   monitor: val/loss
#   patience: 10
#   min_delta: 0.001
#   mode: min

# Checkpointing
checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min

data_transform:
  _target_: dnanet.data.transformer.ReconstructionTransformer
  n_dyes: ${model.num_dyes}
  autoencoder_log_scale: ${model.autoencoder_log_scale}
  autoencoder_max_rfu: ${model.autoencoder_max_rfu}

lightning_module:
  _target_: dnanet.modules.reconstruction.ReconstructionModule
  learning_rate: ${train.learning_rate}
  weight_decay: ${train.weight_decay}
  loss_fn: ${model.loss}
  metrics: ${train.metrics}
  autoencoder_log_scale: ${model.autoencoder_log_scale}
  autoencoder_max_rfu: ${model.autoencoder_max_rfu}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${train.batch_size}
  val_fraction: ${train.val_fraction}
  num_workers: ${train.num_workers}
  seed: ${train.seed}
  stratify_noc: ${oc.select:data.stratify_noc,false}
  group_by_replica: ${oc.select:data.group_by_replica,false}
