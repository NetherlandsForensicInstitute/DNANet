# Training hyperparameters for segmentation models
type: segmentation

max_epochs: 15
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0005
val_fraction: 0.2
test_fraction: 0.0
num_workers: 5
seed: 42
threshold: 0.5

metrics:
  _target_: torchmetrics.MetricCollection
  metrics:
    accuracy:
      _target_: torchmetrics.classification.BinaryAccuracy
      threshold: ${train.threshold}
    precision:
      _target_: torchmetrics.classification.BinaryPrecision
      threshold: ${train.threshold}
    recall:
      _target_: torchmetrics.classification.BinaryRecall
      threshold: ${train.threshold}
    f1:
      _target_: torchmetrics.classification.BinaryF1Score
      threshold: ${train.threshold}
    iou:
      _target_: torchmetrics.classification.BinaryJaccardIndex
      threshold: ${train.threshold}

optimizer:
  _target_: torch.optim.AdamW
  lr: ${train.learning_rate}
  weight_decay: ${train.weight_decay}

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.8
  optimizer: ${train.optimizer}

# Early stopping
early_stopping:
  monitor: val/loss
  patience: 5
  min_delta: 0.01
  mode: min

# Checkpointing
checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min

data_transform:
  _target_: dnanet.data.transformer.SegmentationTransformer

lightning_module:
  _target_: dnanet.modules.segmentation.SegmentationModule
  learning_rate: ${train.learning_rate}
  weight_decay: ${train.weight_decay}
  threshold: ${train.threshold}
  loss_fn: ${model.loss}
  scheduler: ${train.scheduler}
  metrics: ${train.metrics}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${train.batch_size}
  val_fraction: ${train.val_fraction}
  num_workers: ${train.num_workers}
  seed: ${train.seed}
  stratify_noc: ${oc.select:data.stratify_noc,false}
  group_by_replica: ${oc.select:data.group_by_replica,false}

# Cross-validation (only used with task=cross_validate)
n_folds: 5
