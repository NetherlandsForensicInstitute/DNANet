# Training hyperparameters for classification models
type: classification

defaults:
  - /metrics@_global_.metrics: multi-class


max_epochs: 150
batch_size: 1024
learning_rate: 0.0001
weight_decay: 0.0005
val_fraction: 0.1
test_fraction: 0.0
num_workers: 7

optimizer:
  _target_: torch.optim.AdamW
  lr: ${train.learning_rate}
  weight_decay: ${train.weight_decay}

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.8
  optimizer: ${train.optimizer}

# Early stopping
early_stopping:
  monitor: val/f1
  patience: 5
  min_delta: 0.00
  mode: max

# Checkpointing
checkpoint:
  monitor: val/f1
  save_top_k: 1
  mode: max

# module initialization. You shouldn't need to change this
lightning_module:
  _target_: dnanet.modules.classification.ClassificationModule
  learning_rate: ${train.learning_rate}
  weight_decay: ${train.weight_decay}
  loss_fn: ${model.loss}
  num_classes: ${data.num_classes}
  metrics:
    _target_: torchmetrics.MetricCollection
    metrics: ${metrics}
  batch_size: ${train.batch_size}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${train.batch_size}
  num_workers: ${train.num_workers}
  shuffle_train: ${oc.select:data.shuffle_train,true}

callbacks:
  confusion_matrix:
    _target_: dnanet.evaluation.callbacks.ConfusionMatrixCallback
    num_classes: ${model.num_classes}
    stages: [val]
    output_dir: confusion_matrix
