# Training hyperparameters for autoencoder reconstruction
type: reconstruction
max_epochs: 150
batch_size: 16
learning_rate: 0.001
weight_decay: 0.0
num_workers: 7
val_fraction: 0.2

metrics:
  mse:
    _target_: torchmetrics.regression.MeanSquaredError

# No LR scheduler by default for reconstruction
scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 1.0   # effectively disabled

# No early stopping by default (long training benefits AE)
# early_stopping:
#   monitor: val/loss
#   patience: 10
#   min_delta: 0.001
#   mode: min

# Checkpointing
checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min
