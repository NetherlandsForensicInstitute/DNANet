# Training config for combined PeakNet
type: peaknet

max_epochs: 15
batch_size: 8       # Smaller than classification due to full-image + peaks
learning_rate: 0.0001
weight_decay: 0.0005
val_fraction: 0.2
num_workers: 5

scheduler:
  gamma: 0.8

early_stopping:
  monitor: val/loss
  patience: 5
  min_delta: 0.01

checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min
