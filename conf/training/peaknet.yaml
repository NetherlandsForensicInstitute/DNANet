# Training config for combined PeakNet
type: peaknet

max_epochs: 15
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0005
val_fraction: 0.2
num_workers: 7
seed: 42

metrics:
  _target_: torchmetrics.MetricCollection
  metrics:
    precision:
      _target_: torchmetrics.classification.MulticlassPrecision
      num_classes: ${model.architecture.num_classes}
      average: macro
    recall:
      _target_: torchmetrics.classification.MulticlassRecall
      num_classes: ${model.architecture.num_classes}
      average: macro
    f1:
      _target_: torchmetrics.classification.MulticlassF1Score
      num_classes: ${model.architecture.num_classes}
      average: macro

optimizer:
  _target_: torch.optim.AdamW
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}

scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.8
  optimizer: ${training.optimizer}

early_stopping:
  monitor: val/loss
  patience: 5
  min_delta: 0.01
  mode: min

checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min

lightning_module:
  _target_: dnanet.modules.peaknet.PeakNetModule
  learning_rate: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  loss_fn: ${model.loss}
  num_classes: ${model.architecture.num_classes}
  scheduler: ${training.scheduler}
  metrics: ${training.metrics}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${training.batch_size}
  val_fraction: ${training.val_fraction}
  num_workers: ${training.num_workers}
  seed: ${training.seed}
  stratify_noc: ${oc.select:data.stratify_noc,false}
  group_by_replica: ${oc.select:data.group_by_replica,false}
