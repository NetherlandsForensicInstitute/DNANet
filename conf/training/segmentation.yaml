# Training hyperparameters for segmentation models
type: segmentation

max_epochs: 15
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0005
val_fraction: 0.2
num_workers: 5
seed: 42
threshold: 0.5

metrics:
  _target_: torchmetrics.MetricCollection
  metrics:
    accuracy:
      _target_: torchmetrics.classification.BinaryAccuracy
      threshold: ${training.threshold}
    precision:
      _target_: torchmetrics.classification.BinaryPrecision
      threshold: ${training.threshold}
    recall:
      _target_: torchmetrics.classification.BinaryRecall
      threshold: ${training.threshold}
    f1:
      _target_: torchmetrics.classification.BinaryF1Score
      threshold: ${training.threshold}
    iou:
      _target_: torchmetrics.classification.BinaryJaccardIndex
      threshold: ${training.threshold}

optimizer:
  _target_: torch.optim.AdamW
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.8
  optimizer: ${training.optimizer}

# Early stopping
early_stopping:
  monitor: val/loss
  patience: 5
  min_delta: 0.01
  mode: min

# Checkpointing
checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min

lightning_module:
  _target_: dnanet.modules.segmentation.SegmentationModule
  learning_rate: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  threshold: ${training.threshold}
  loss_fn: ${model.loss}
  scheduler: ${training.scheduler}
  metrics: ${training.metrics}

data_module:
  _target_: dnanet.data.datamodule.DNANetDataModule
  batch_size: ${training.batch_size}
  val_fraction: ${training.val_fraction}
  num_workers: ${training.num_workers}
  seed: ${training.seed}
  stratify_noc: ${oc.select:data.stratify_noc,false}
  group_by_replica: ${oc.select:data.group_by_replica,false}

# Cross-validation (only used with task=cross_validate)
n_folds: 5
