# Training hyperparameters for classification models
type: classification
max_epochs: 15
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.0005
num_workers: 0

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.8

# Early stopping
early_stopping:
  monitor: val/loss
  patience: 5
  min_delta: 0.01
  mode: min

# Checkpointing
checkpoint:
  monitor: val/loss
  save_top_k: 1
  mode: min
