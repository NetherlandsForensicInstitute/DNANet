# NFI R&D 2p/5p mixture dataset (PPF6C kit)
name: dnanet_rd

# Kit / scaling strategy
kit: PPF6C
dataset_strategy: NFI_RND

# Paths (relative to project root)
root: data/2p_5p_Dataset_NFI/Raw data .HID files
annotations_path: data/2p_5p_Dataset_NFI/txt_annotations_2024
hid_to_annotations_path: data/2p_5p_Dataset_NFI/2p_5p_hid_to_annotation.csv
best_ladder_paths_csv: data/2p_5p_Dataset_NFI/best_ladder_paths_DTH.csv
ladder_alleles_csv: data/2p_5p_Dataset_NFI/ladder_alleles.csv

# Analysis settings
analysis_threshold_type: DTH  # DTH (high) or DTL (low)
data_loading_strategy: superior  # raw, analyzed, or superior
adjustment_of_annotations: complete  # top, complete, or null

# Limits and options
limit: null  # Set to integer to limit number of loaded images
skip_if_invalid_ladder: false
include_size_standard: false

# Preprocessing parameters
preprocessing:
  rfu_threshold: 40          # Minimum peak height in RFU
  signal_length: 4096        # Number of scan points per dye channel
  base_pair_range: [65, 475] # Valid base-pair range for analysis
