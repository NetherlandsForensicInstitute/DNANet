# NFI R&D 2p/5p mixture dataset (PPF6C kit)
name: dnanet_rd

# Dataset loading options
dataset:
  _target_: dnanet.data.hid_dataset.HIDDataset
  root: data/2p_5p_Dataset_NFI
  scaling_strategy:
      _target_: dnanet.data.strategies.scaling.powerplex_fusion_6c.PowerPlexFusion6CStrategy
      scanpoint_resolution: 4096
  dataset_strategy:
      _target_: dnanet.data.strategies.datasets.NFIRnDStrategy
      annotation_type: ground_truth # DTH (analyst high threshold), or DTL (analyst low threshold), span, or ground_truth
  limit: null  # Set to integer to limit number of loaded images
  skip_if_invalid_ladder: true
  include_size_standard: true
  data_loading_strategy: superior  # raw, analyzed, or superior
  adjustment_of_annotations: top  # top, complete, or null
  transform: ${oc.select:${task}.data_transform,${model.data_transform}}  # task-specific transform (e.g. evaluate wraps it), falls back to model's base transform
  load_in_memory: false
  cache_dir: data/cache/dnanet_rd

# splitting options
stratify_noc: false
group_by_replica: false
