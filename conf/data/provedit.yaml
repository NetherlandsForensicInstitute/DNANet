# PROVEDIt dataset (GlobalFiler kit)
name: provedit


# Paths (relative to project root — adjust for your setup)
dataset:
  _target_: dnanet.data.hid_dataset.HIDDataset
  root: data/PROVEDIt/
  scaling_strategy: ${data.scaling_strategy}
  dataset_strategy: ${data.dataset_strategy}
  limit: null  # Set to integer to limit number of loaded images
  skip_if_invalid_ladder: true
  include_size_standard: true
  data_loading_strategy: superior  # raw, analyzed, or superior
  adjustment_of_annotations: top  # top, complete, or null
  transform: ${oc.select:${task}.data_transform,null}  # get transform from training/evaluation task, or null if not defined
  load_in_memory: true


# splitting options
stratify_noc: false
group_by_replica: false

# scaling strategy
scaling_strategy:
  _target_: dnanet.data.strategies.scaling.globalfiler.GlobalFilerStrategy
  scanpoint_resolution: 4096

# dataset strategy
dataset_strategy:
  _target_: dnanet.data.strategies.datasets.get_dataset_strategy
  name: PROVEDIT
