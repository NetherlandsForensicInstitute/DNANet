# PROVEDIt dataset (GlobalFiler kit)
name: provedit

# Kit / scaling strategy
kit: GLOBALFILER
dataset_strategy: PROVEDIT

# Paths (relative to project root — adjust for your setup)
root: data/PROVEDIt/
annotations_path: null  # ProvedIt XLSX annotation loading not yet implemented
hid_to_annotations_path: null
best_ladder_paths_csv: null
ladder_alleles_csv: null

# Analysis settings
analysis_threshold_type: DTH
data_loading_strategy: superior
adjustment_of_annotations: top

# Limits and options
limit: null
skip_if_invalid_ladder: false
include_size_standard: false

# Preprocessing parameters
preprocessing:
  rfu_threshold: 40          # Minimum peak height in RFU
  signal_length: 4096        # Number of scan points per dye channel
  base_pair_range: [60, 480] # Valid base-pair range for GlobalFiler
