# Dataset that takes multiple datasets and merges them into one ConcatDataset.
name: concat

defaults:
  # Set references to the yaml files located in the `data` config folder.
  - /data@dataset_1: provedit
  - /data@dataset_2: dnanet_rd

dataset:
  _target_: torch.utils.data.ConcatDataset
  datasets:
    - ${data.dataset_1.dataset}
    - ${data.dataset_2.dataset}
