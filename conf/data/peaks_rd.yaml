# Peak window dataset for standalone peak classifier training.
# Extends dnanet_rd data with peak extraction settings.
name: peaks_rd

# Inherit all base data settings from dnanet_rd
dataset:
  _target_: dnanet.data.hid_dataset.HIDDataset
  root: data/2p_5p_Dataset_NFI
  scaling_strategy: PPF6C
  dataset_strategy: NFI_RND
  analysis_threshold_type: DTH
  data_loading_strategy: superior
  adjustment_of_annotations: top
  limit: null
  skip_if_invalid_ladder: true
  include_size_standard: true

preprocessing:
  rfu_threshold: 0
  signal_length: 4096
  base_pair_range: [65, 475]

# Peak extraction settings
peak_extraction:
  threshold: 25
  window_size: 120
  include_max_pool_dyes: false
  preprocess: true
  smooth_keep_factor: null
  log_scale: false
  max_rfu_value: null
  labels: [noise, allele]
  use_ground_truth: true
