[project]
name = "dnanet"
version = "0.1.0"
description = "A clean, extensible deep learning framework for forensic DNA profile analysis."
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    # Deep learning
    "torch>=2.5.1",
    "torchmetrics>=1.7.1",
    "lightning>=2.4.0",

    # Configuration
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",

    # Data & science
    "numpy>=2.2.4",
    "scipy>=1.15.1",
    "construct>=2.10.70",
    "pyarrow>=15.0.0",
    "pydantic>=2.12.5",

    # Visualization
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",

    # Experiment tracking
    "mlflow>=2.21.3",

    # Logging
    "loguru>=0.7.3",

    # Utilities
    "tqdm>=4.67.1",
    "coolname>=2.2.0",
    "openpyxl>=3.1.5",
    "flatten-dict>=0.5.0",
]

[project.optional-dependencies]
tools = [
    "plotly>=6.0.0",
]
docs = [
    "zensical>=0.0.43",
]

[project.scripts]
dnanet = "dnanet.cli:main"
dnanet-label = "dnanet.tools.labeltool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnanet"]

[dependency-groups]
testing = [
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-loguru>=0.4.0",
]
quality = [
    "ruff>=0.15.5",
    "mypy>=1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dnanet --cov-report=term"

[tool.coverage.run]
branch = true
source = ["dnanet"]
omit = ["tests/*", "*__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
extend-exclude = [".venv"]
line-length = 101

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["I", "B", "D", "NPY", "TC"]
exclude = ["tests/*"]
ignore = [
    "D100",
    "D107",
    "D105",
    "D102"
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "D104"]
"**/{tests,docs}/*" = ["E402", "D"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"
disable_error_code = ["import-untyped"]
