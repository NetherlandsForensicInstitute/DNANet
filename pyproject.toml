[project]
name = "DNANet"
version = "0.1.0"
description = " An open source repository offering tools for parsing DNA profiles and integrating machine learning models."

dependencies = [
    "numpy>=2.2.4",
    "scipy>=1.15.1",
    "tqdm>=4.67.1",
    "confidence>=0.15",
    "torch>=2.5.1",
    "torchmetrics>=1.7.1",
    "construct>=2.10.70",
    "datasets>=4.0.0",
    "matplotlib>=3.10.1",
    "mlflow>=2.21.3",
    "tensorboard>=2.18.0",
    "huggingface-hub[hf_xet]>=0.35.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
    "pydantic-numpy>=8.0.1",
    "loguru>=0.7.3",

]
requires-python = ">=3.10,<=3.12"
readme = "README.md"
license = {text = "Apache-2.0"}


[project.optional-dependencies]
quality = [
    "ruff>=0.15.5",
    "mypy>=1.19.1",
]
[tool.pdm]
distribution = false

[dependency-groups]
testing = [
    "pytest>=8.3.5",
]

[tool.pdm.scripts]
test = "pdm run pytest"
lint = "pdm run ruff check ."
format = "pdm run ruff format --check ."
typing = "pdm run mypy"
